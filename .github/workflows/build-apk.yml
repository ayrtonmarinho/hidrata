name: Gerar APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Número da versão no app
        run: echo "window.HIDRATA_BUILD = ${{ github.run_number }};" > www/config.js

      - name: Copiar o app web para o projeto Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Hidrata-v${{ github.run_number }}.apk"

      - name: Guardar APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Hidrata-v${{ github.run_number }}
          path: Hidrata-v${{ github.run_number }}.apk

      - name: Publicar em Releases (fácil de baixar pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Hidrata v${{ github.run_number }}
          body: "Baixe o arquivo .apk abaixo e abra no celular para instalar ou atualizar."
          files: Hidrata-v${{ github.run_number }}.apk
          make_latest: true
